<!DOCTYPE html>
<html lang="en">
<head>
    {% include '_head.html' %}
    <title>Themarr</title>
</head>
<body class="bg-page text-ink h-screen overflow-hidden flex flex-col text-sm">

<header class="h-14 flex-shrink-0 bg-side border-b border-line flex items-center gap-4 px-4">
    <a href="#/library" class="brand flex items-center gap-2.5">
        <img src="{{ url_for('static', filename='favicon.ico') }}" alt="" class="w-8 h-8 rounded-full">
        <span class="text-[17px] font-semibold tracking-wide max-[1000px]:hidden">Themarr</span>
    </a>
    <div class="relative flex-1 max-w-md">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-faint pointer-events-none"></i>
        <input id="globalSearch" type="search" placeholder="Search library" autocomplete="off" class="field w-full pl-9 py-2">
    </div>
    <div class="ml-auto flex items-center gap-1">
        <a id="activityIndicator" href="#/activity" class="hidden items-center gap-2 px-3 py-1.5 rounded-md text-muted hover:bg-raised hover:text-ink text-xs">
            <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-accent opacity-60"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-accent"></span></span>
            <span id="activityIndicatorText"></span>
        </a>
        <button id="refreshBtn" class="icon-btn p-2" title="Refresh: read this page again from disk and Jellyfin"><i data-lucide="refresh-cw"></i></button>
    </div>
</header>

<div class="flex flex-1 min-h-0">
    <nav class="sidebar relative flex-shrink-0 bg-side border-r border-line py-3 flex flex-col gap-0.5">
        <div data-resize="sidebar" class="resize-handle -right-1"></div>
        <a class="nav-item" data-nav="library" href="#/library" title="Library"><i data-lucide="library"></i><span class="label flex-1">Library</span></a>
        <a class="nav-item" data-nav="missing" href="#/missing" title="Missing"><i data-lucide="circle-dashed"></i><span class="label flex-1">Missing</span><span id="navMissingCount" class="label hidden text-[11px] bg-raised text-muted rounded px-1.5"></span></a>
        <a class="nav-item" data-nav="activity" href="#/activity" title="Activity"><i data-lucide="activity"></i><span class="label flex-1">Activity</span><span id="navQueueCount" class="label hidden text-[11px] bg-accent text-white rounded px-1.5"></span></a>
        <a class="nav-item" data-nav="settings" href="#/settings" title="Settings"><i data-lucide="settings"></i><span class="label flex-1">Settings</span></a>
        <div id="appVersion" class="label mt-auto mx-5 text-[11px] text-faint"></div>
    </nav>

    <div class="relative flex-1 min-w-0">
        <!-- Background art behind the page (Settings > Display > Backdrops) -->
        <div id="backdrop" class="page-backdrop"></div>
        <main id="view" class="absolute inset-0 overflow-y-auto scroll"></main>
    </div>
</div>

<!-- Add theme drawer -->
<div id="drawerOverlay" class="hidden fixed inset-0 bg-black/60 z-30"></div>
<aside id="drawer" class="fixed top-0 right-0 h-full drawer bg-side border-l border-line z-40 translate-x-full transition-transform duration-200 flex flex-col"></aside>
<!-- Tabs on the right edge: the drawer minimized (brings it back as it was) and the library theme still playing -->
<div class="fixed right-0 top-1/2 -translate-y-1/2 z-[35] flex flex-col items-end gap-2">
    <div id="drawerTab" class="hidden w-10 flex flex-col items-center gap-2 py-3 bg-side border border-r-0 border-line rounded-l-lg shadow-2xl cursor-pointer hover:bg-surface transition-colors"></div>
    <div id="nowPlayingTab" class="hidden w-10 flex flex-col items-center gap-2 py-3 bg-side border border-r-0 border-line rounded-l-lg shadow-2xl cursor-pointer hover:bg-surface transition-colors"></div>
</div>

<!-- Dialogs (confirm, folder picker, backup import) -->
<div id="dialogOverlay" class="hidden fixed inset-0 bg-black/70 z-50 grid place-items-center p-4">
    <div id="dialog" class="card w-full max-w-md shadow-2xl"></div>
</div>

<div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 items-end pointer-events-none"></div>

<audio id="player" preload="none"></audio>
<input type="file" id="backupUploadInput" accept=".zip" class="hidden">

<script>window.THEMARR = { serverMode: {{ 'true' if server_mode else 'false' }} };</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/library.js') }}"></script>
<script src="{{ url_for('static', filename='js/media.js') }}"></script>
<script src="{{ url_for('static', filename='js/add-theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/missing.js') }}"></script>
<script src="{{ url_for('static', filename='js/activity.js') }}"></script>
<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
<script>App.start();</script>
</body>
</html>
